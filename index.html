<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171923">
<title>Magic Tokens</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 22px 15px 40px;
  background: #171923;
  color: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
main { max-width: 500px; margin: auto; }
h1 { text-align: center; color: #e8c76a; margin-bottom: 5px; }
.subtitle { text-align: center; color: #aaa; margin-top: 0; }
h2 { font-size: 18px; }
.catalog {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.token {
  background: #242735;
  border: 1px solid #41465a;
  border-radius: 14px;
  padding: 16px 10px;
  color: white;
  text-align: center;
  cursor: pointer;
}
.token:active { transform: scale(.97); }
.token.selected { border: 2px solid #e8c76a; }
.symbol { font-size: 35px; display: block; margin-bottom: 8px; }
.token-name { font-weight: bold; font-size: 16px; }
.token-type { display: block; color: #aaa; font-size: 12px; margin-top: 5px; }
.card {
  margin-top: 20px;
  background: #242735;
  border: 1px solid #41465a;
  border-radius: 18px;
  padding: 20px;
  text-align: center;
}
.count { font-size: 60px; font-weight: 800; margin: 12px 0; color: #8fe3a0; }
.buttons { display: flex; gap: 10px; }
button {
  border: 0;
  border-radius: 11px;
  padding: 13px 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
.buttons button { flex: 1; }
.minus { background: #45495b; color: white; }
.plus { background: #e8c76a; color: #171923; }
.reset { width: 100%; margin-top: 15px; background: #343849; color: white; }
.hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>✦ MAGIC TOKENS ✦</h1>
  <p class="subtitle">Elige tu ficha y lleva la cuenta</p>

  <h2>Catálogo de tokens</h2>
  <div class="catalog" id="catalog"></div>

  <section class="card hidden" id="counter">
    <div id="chosenSymbol" class="symbol"></div>
    <div id="chosenName"></div>
<div id="chosenStats"></div>
<div id="activeAbilityIcons"></div>
<div id="statsButtons" class="buttons hidden">
  <button class="minus" onclick="changeStat('power', -1)">Fuerza −</button>
  <button class="plus" onclick="changeStat('power', 1)">Fuerza +</button>
  <button class="minus" onclick="changeStat('toughness', -1)">Resistencia −</button>
  <button class="plus" onclick="changeStat('toughness', 1)">Resistencia +</button>
</div>
<div id="abilityButtons" class="buttons hidden"></div>
<div class="count" id="count">0</div>
    <div class="buttons">
      <button class="minus" onclick="change(-1)">− 1</button>
      <button class="plus" onclick="change(1)">+ 1</button>
      <button class="plus" onclick="change(5)">+ 5</button>
    </div>
    <button class="reset" onclick="resetCurrent()">Reiniciar esta ficha</button>
  </section>

  <section class="card">
    <strong>Resumen de la partida</strong>
    <p id="summary">Selecciona un token para comenzar.</p>
    <button class="reset" onclick="resetAll()">Reiniciar todos los tokens</button>
  </section>
</main>

<script>
const tokenTypes = [
  { id: "goblin", name: "Goblin", type: "Criatura", symbol: "👺", image: "https://cards.scryfall.io/display/front/b/d/bd79264f-0734-48b7-8333-4035e518d46c.webp?1783934931", power: 1, toughness: 1 },
  { id: "treasure", name: "Tesoro", type: "Artefacto", symbol: "💰", image: "https://cards.scryfall.io/display/front/0/3/03992f88-7a15-4234-9bed-b7617d7ff09c.webp?1789735245" },
  { id: "soldier", name: "Soldado", type: "Criatura", symbol: "🛡️", image: "https://cards.scryfall.io/display/front/f/6/f633b8c5-2cd1-4599-bfce-543ca5439b41.webp?1783920664", power: 1, toughness: 1 },
  { id: "food", name: "Comida", type: "Artefacto", symbol: "🍖", image: "https://cards.scryfall.io/display/front/d/a/da1fca2e-4ea7-4c5f-bd58-f9529dfb6f37.webp?1783903567" },
  { id: "spirit", name: "Espíritu", type: "Criatura", symbol: "👻", image: "https://cards.scryfall.io/display/front/f/2/f22410b3-5c0b-4282-9b0b-5ba61229b6e7.webp?1783906786", power: 1, toughness: 1 },
  { id: "beast", name: "Bestia", type: "Criatura", symbol: "🐺" , image: "https://cards.scryfall.io/display/front/a/7/a7382e4b-43dc-4b35-8a9e-ab886ea0a981.webp?1783942524", power: 3, toughness: 3},
  { id: "zombie", name: "Zombie", type: "Criatura", symbol: "🧟", image: "https://cards.scryfall.io/display/front/a/e/ae290b7e-8ff2-4262-8ac7-8481283e2a02.webp?1783907968", power: 1, toughness: 1 },
  { id: "bird", name: "Ave", type: "Criatura", symbol: "🐦", image: "https://cards.scryfall.io/display/front/0/0/000d9280-a79a-4f9f-822c-7aaecbff3337.webp?1783911527", power: 1, toughness: 1 }
];

const counts = {};
tokenTypes.forEach(token => counts[token.id] = 0);
let selected = null;
const stats = {};
tokenTypes.forEach(token => {
  if (token.power !== undefined && token.toughness !== undefined) {
    stats[token.id] = {
      power: token.power,
      toughness: token.toughness
    };
  }
});
  const abilities = [
  { id: "haste", label: "Haste" },
  { id: "deathtouch", label: "Deathtouch" },
  { id: "trample", label: "Trample" },
  { id: "flying", label: "Flying" },
  { id: "summoningSickness", label: "Summoning sickness" },
  { id: "indestructible", label: "Indestructible" },
  { id: "firstStrike", label: "First strike" },
  { id: "doubleStrike", label: "Double strike" },
  { id: "vigilance", label: "Vigilance" },
  { id: "lifelink", label: "Lifelink" },
  { id: "menace", label: "Menace" },
  { id: "hexproof", label: "Hexproof" }
];
const abilityIcons = {
  haste: "🔥",
  deathtouch: "☠️",
  trample: "💥",
  flying: "🪽",
  summoningSickness: "💤",
  indestructible: "🛡️",
  firstStrike: "⚔️",
  doubleStrike: "⚔️⚔️",
  vigilance: "👁️",
  lifelink: "❤️",
  menace: "👹",
  hexproof: "✨"
};
const tokenAbilities = {};
tokenTypes.forEach(token => {
  tokenAbilities[token.id] = {};
  abilities.forEach(ability => {
    tokenAbilities[token.id][ability.id] = false;
  });
});
const catalog = document.getElementById("catalog");

tokenTypes.forEach(token => {
  const button = document.createElement("button");
  button.className = "token";
button.innerHTML =
  (token.image
    ? '<img src="' + token.image + '" alt="' + token.name +
      '" style="width:100%;max-width:150px;border-radius:8px;margin-bottom:8px;">'
    : '<span class="symbol">' + token.symbol + '</span>') +
  '<span class="token-name">' + token.name + '</span>' +
  '<span class="token-type">' + token.type + '</span>';
  button.onclick = () => selectToken(token.id);
  button.id = "token-" + token.id;
  catalog.appendChild(button);
});

function selectToken(id) {
  selected = id;
  const token = tokenTypes.find(item => item.id === id);

  document.getElementById("counter").classList.remove("hidden");

  document.getElementById("chosenSymbol").innerHTML = token.image
    ? '<img src="' + token.image + '" alt="' + token.name + '" style="width:150px;max-width:100%;border-radius:10px;">'
    : token.symbol;

  document.getElementById("chosenName").textContent = token.name;

  document.getElementById("statsButtons").classList.toggle(
    "hidden",
    !stats[id]
  );

  document.getElementById("abilityButtons").classList.toggle(
    "hidden",
    !stats[id]
  );

  document.getElementById("chosenStats").textContent =
    stats[id] ? stats[id].power + "/" + stats[id].toughness : "";

  renderAbilityButtons();

  document.querySelectorAll(".token").forEach(button => {
    button.classList.remove("selected");
  });

  document.getElementById("token-" + id).classList.add("selected");

  update();
}
function renderAbilityButtons() {
  const container = document.getElementById("abilityButtons");
  const iconsContainer = document.getElementById("activeAbilityIcons");

  if (!selected || !tokenAbilities[selected]) return;

  container.innerHTML = abilities.map(ability => {
    const active = tokenAbilities[selected][ability.id];

    return '<button class="' + (active ? 'plus' : 'minus') +
      '" onclick="toggleAbility(\'' + ability.id + '\')">' +
      (active ? '✓ ' : '') + ability.label + '</button>';
  }).join("");

  iconsContainer.innerHTML = abilities
    .filter(ability => tokenAbilities[selected][ability.id])
    .map(ability =>
      '<span title="' + ability.label + '">' +
      abilityIcons[ability.id] + '</span>'
    ).join(" ");
}
function changeStat(stat, amount) {
  if (!selected || !stats[selected]) return;

  stats[selected][stat] = Math.max(
    0,
    stats[selected][stat] + amount
  );

  document.getElementById("chosenStats").textContent =
    stats[selected].power + "/" + stats[selected].toughness;
}

function change(amount) {
  if (!selected) return;
  counts[selected] = Math.max(0, counts[selected] + amount);
  update();
}
  function renderAbilityButtons() {
  const container = document.getElementById("abilityButtons");

  if (!selected || !tokenAbilities[selected]) return;

  container.innerHTML = abilities.map(ability => {
    const active = tokenAbilities[selected][ability.id];

    return '<button class="' + (active ? 'plus' : 'minus') +
      '" onclick="toggleAbility(\'' + ability.id + '\')">' +
      (active ? '✓ ' : '') + ability.label + '</button>';
  }).join("");
}

function toggleAbility(abilityId) {
  if (!selected || !tokenAbilities[selected]) return;

  tokenAbilities[selected][abilityId] =
    !tokenAbilities[selected][abilityId];

  renderAbilityButtons();
}

function resetCurrent() {
  if (!selected) return;
  const token = tokenTypes.find(item => item.id === selected);
  if (confirm("¿Reiniciar los tokens de " + token.name + "?")) {
    counts[selected] = 0;
    update();
  }
}

function resetAll() {
  if (confirm("¿Reiniciar todos los tokens de la partida?")) {
    tokenTypes.forEach(token => counts[token.id] = 0);
    update();
  }
}

function update() {
  if (selected) {
    document.getElementById("count").textContent = counts[selected];
  }

  const active = tokenTypes.filter(token => counts[token.id] > 0);
  document.getElementById("summary").textContent = active.length
    ? active.map(token => token.symbol + " " + token.name + ": " + counts[token.id]).join(" · ")
    : "No hay tokens en la partida.";
}
</script>
</body>
</html>
